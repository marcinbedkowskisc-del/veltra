name: veltra

x-backend-environment: &backend-environment
  APP_NAME: VELTRA 2.0
  APP_ENV: local
  APP_DEBUG: "false"
  APP_LOCALE: pl
  APP_FALLBACK_LOCALE: pl
  DEV_MANAGEMENT_ENABLED: ${DEV_MANAGEMENT_ENABLED:-false}
  DEV_MANAGEMENT_TOKEN: ${DEV_MANAGEMENT_TOKEN:-}
  PHP_CLI_SERVER_WORKERS: "4"
  APP_KEY: ${APP_KEY:?Run the environment initialization command from README}
  APP_DB_MUTATION_SIGNING_KEY: ${APP_DB_MUTATION_SIGNING_KEY:?Set an independent 32-byte database mutation signing key}
  APP_URL: http://localhost:${BACKEND_PORT:-8000}
  FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-veltra}
  DB_USERNAME: ${APP_DB_USERNAME:-veltra_app}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Run the environment initialization command from README}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: "120"
  SANCTUM_STATEFUL_DOMAINS: localhost:${FRONTEND_PORT:-5173},localhost:${BACKEND_PORT:-8000},127.0.0.1:${FRONTEND_PORT:-5173},127.0.0.1:${BACKEND_PORT:-8000}
  QUEUE_CONNECTION: redis
  QUEUE_FAILED_DRIVER: file
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CACHE_DB: "1"
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: noreply@veltra.test

x-backend: &backend
  image: veltra-backend:stage1f-polish-localization
  build:
    context: ./backend
  # Bound DNS failure latency when a dependency container is stopped.
  dns_opt:
    - timeout:1
    - attempts:1
  environment: *backend-environment
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  mailpit:
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 8s
      retries: 3
      start_period: 20s

  migrate:
    <<: *backend
    profiles: ["migrations"]
    environment:
      <<: *backend-environment
      DB_USERNAME: ${APP_DB_MIGRATION_USERNAME:-veltra_migrator}
      DB_PASSWORD: ${APP_DB_MIGRATION_PASSWORD:?Run the environment initialization command from README}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-veltra_app}
      APP_DB_MIGRATION_USERNAME: ${APP_DB_MIGRATION_USERNAME:-veltra_migrator}
      APP_DB_AUTHORIZATION_HISTORY_ATTESTATION: ${APP_DB_AUTHORIZATION_HISTORY_ATTESTATION:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "migrate", "--force"]

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60"]
    stop_grace_period: 70s

  frontend:
    image: veltra-frontend:stage1f-polish-localization
    build:
      context: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veltra}
      POSTGRES_USER: ${POSTGRES_USER:-veltra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the environment initialization command from README}
      APP_DB_USERNAME: ${APP_DB_USERNAME:-veltra_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run the environment initialization command from README}
      APP_DB_MIGRATION_USERNAME: ${APP_DB_MIGRATION_USERNAME:-veltra_migrator}
      APP_DB_MIGRATION_PASSWORD: ${APP_DB_MIGRATION_PASSWORD:?Run the environment initialization command from README}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/10-create-runtime-role.sh:/docker-entrypoint-initdb.d/10-create-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${APP_DB_MIGRATION_USERNAME}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
